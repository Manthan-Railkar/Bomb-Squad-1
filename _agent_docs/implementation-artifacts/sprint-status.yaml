nbridges. All bridge calls best-effort AFTER the authoritative emit (.catch swallow) — voice never gates state (AC #5). New REQUIRED env LIVEKIT_SERVER_URL (server→LiveKit HTTP admin, http://livekit:7880 compose, DISTINCT from browser ws:// LIVEKIT_URL — WSL2 memory). livekit.yaml+livekit.dev.yaml webhook block → http://server:3001/livekit/webhook. SessionHandlerDeps.loungeBridge OPTIONAL (LoungeBridgePort) so ~25 test call sites compile unchanged. Client: VoiceController mode+publish from resolved scope (resting shows lounge copy); MuteControl gate role→voiceStore.publishing (lounge publishers get it); lounge microcopy updated. tsc clean all 4 workspaces; shared 235(+8) / server 569(+21) / client 431 green. Real-container LiveKit integration test ADDED (Jay asked): loungeBridge.integration.test.ts gated RUN_LIVEKIT_IT=1 (skipped by default → CI green), ran against docker livekit v1.13.1 → 5/5 pass (real RoomServiceClient HTTP-admin create/list/delete + bridge best-effort error swallowing + WebhookReceiver unsigned-reject). Full 2-peer audio FORWARD still needs @livekit/rtc-node (uninstalled) or browsers → Jay's Task 10. sim-clients NOT extended (no voice leg). Task 10 = Jay interactive ≥3-browser verify (active speaks→lounge hears; resting/spectator hear each other but NOT into active bomb room = one-way boundary; turn flip swaps rooms; kill voice→game continues) OUTSTANDING — stays review until observed (human-verification AC rule). # 3-5 (token re-mint) CODE REVIEW (Blind+EdgeCase+Auditor): core logic sound, all 6 ACs present. 3 convergent findings → all 3 patched (Jay's calls): (1) reconciler now TEARS DOWN on desired===null while connected/unavailable (new VoiceAction 'disconnect' — closes stale-publishing-leak for facilitator/un-teamed/self-removed-from-roster, not reachable via TEAM_ASSIGN today but is via 3.7 relay/roster-removal); (2) computeVoiceAction now RE-MINTS from unavailable-after-connect per AC#5 (was connected-only) with a lastAttemptRef single-sh